# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

# Smithery builds the Dockerfile. The image bundles dnstwist, so no Docker
# daemon is needed inside it.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      runner:
        type: string
        enum: [auto, local, docker]
        default: local
        description: How to run dnstwist. The image bundles dnstwist, so keep "local".
      timeoutSeconds:
        type: integer
        minimum: 1
        maximum: 86400
        default: 600
        description: Maximum seconds a scan may run before it is stopped
  commandFunction:
    # A function that produces the CLI command to start the MCP on stdio.
    |-
    (config) => ({
      command: 'node',
      args: ['build/index.js'],
      env: {
        DNSTWIST_RUNNER: config.runner || 'local',
        DNSTWIST_TIMEOUT_SECONDS: String(config.timeoutSeconds || 600)
      }
    })
