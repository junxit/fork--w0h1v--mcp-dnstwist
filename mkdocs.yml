site_name: mcp-dnstwist
site_description: MCP server that lets AI agents find typosquatting and lookalike domains with dnstwist
site_url: https://w0h1v.github.io/mcp-dnstwist/
repo_url: https://github.com/w0h1v/mcp-dnstwist
repo_name: w0h1v/mcp-dnstwist
edit_uri: edit/main/docs/
copyright: MIT · Independent project, not affiliated with dnstwist.

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  # Dark by default (first entry wins); the toggle switches to light and the
  # choice is remembered per visitor.
  palette:
    - scheme: slate
      primary: black
      accent: cyan
      toggle: {icon: material/weather-sunny, name: Light mode}
    - scheme: default
      primary: black
      accent: cyan
      toggle: {icon: material/weather-night, name: Dark mode}
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

hooks:
  - mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Using it:
      - Connect a client: clients.md
      - Tool reference: tools.md
      - Example workflows: examples.md
      - Security model: security.md
      - Troubleshooting: troubleshooting.md
